name: aps_alagamentos
description: App móvel de relatos e alertas de alagamentos urbanos (APS - Sistemas Distribuídos).
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: { sdk: flutter }
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^6.0.0
  geolocator: ^12.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  uuid: ^4.4.0
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^4.0.0
flutter: { uses-material-design: true }
